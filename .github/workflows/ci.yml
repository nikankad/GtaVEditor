name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore SaveEditor.sln --locked-mode
      - name: Run synthetic regression checks
        run: dotnet run --project .github/checks -c Release -p:RestoreLockedMode=true
      - name: Check bundled artwork and image lookups
        run: dotnet run --project .github/artwork-checks -c Release -p:RestoreLockedMode=true
      - name: Publish self-contained app
        run: dotnet publish src/SaveEditor.App -c Release -p:PublishProfile=Public -p:RestoreLockedMode=true -o publish
      - name: Launch packaged app
        shell: pwsh
        run: ./.github/checks/Startup.ps1 -Executable publish/GtaVSaveEditor.exe
      - name: Add notices and checksum
        shell: pwsh
        run: |
          if ((Get-Item publish/GtaVSaveEditor.exe).Length -lt 30MB) { throw 'The public EXE must bundle the runtime.' }
          Copy-Item LICENSE, NOTICE publish/
          $hash = (Get-FileHash publish/GtaVSaveEditor.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'publish/SHA256SUMS.txt'), "$hash  GtaVSaveEditor.exe`n")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview
          path: |
            publish/GtaVSaveEditor.exe
            publish/LICENSE
            publish/NOTICE
            publish/SHA256SUMS.txt
          if-no-files-found: error
