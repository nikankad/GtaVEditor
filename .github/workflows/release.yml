name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Use a version tag such as v1.1.0 or v1.1.0-rc.1.'
          }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --silent
          if ($LASTEXITCODE -ne 0) { throw 'The version tag must already exist.' }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore SaveEditor.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet test tests/SaveEditor.Tests -c Release --no-restore --logger 'trx;LogFileName=tests.trx'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Package
        shell: pwsh
        env:
          GTAV_SAVE_KEY: ${{ secrets.GTAV_SAVE_KEY }}
        run: |
          $keyPath = Join-Path $PWD 'src/SaveEditor.GtaV/Data/gtav-pc.key'
          try {
            if ($env:GTAV_SAVE_KEY) {
              $key = [Convert]::FromBase64String($env:GTAV_SAVE_KEY.Trim())
              if ($key.Length -ne 32) { throw 'GTAV_SAVE_KEY must decode to exactly 32 bytes.' }
              [IO.File]::WriteAllBytes($keyPath, $key)
            }
            ./scripts/Publish-App.ps1 -Version $env:RELEASE_TAG.Substring(1) -LockedMode
          }
          finally {
            if (Test-Path $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          }

      - name: Smoke test packaged app startup
        shell: pwsh
        run: ./scripts/Test-AppStartup.ps1 -ArchivePath artifacts/release/GtaVSaveEditor-win-x64.zip

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-release
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GTAV_SAVE_KEY: ${{ secrets.GTAV_SAVE_KEY }}
        run: |
          $keyNote = if ($env:GTAV_SAVE_KEY) {
            'This build includes the PC save key. You do not need to import it.'
          } else {
            'This build requires a one-time key import. See the README for setup.'
          }
          $notes = @"
          Download **GtaVSaveEditor-win-x64.zip**, extract it, and run **GtaVSaveEditor.exe**.

          Nothing else to install: the .NET runtime is built in.

          $keyNote

          Story mode PC saves only. Back up your saves before editing. GTA V Enhanced compatibility has not been verified.

          Check the ZIP against **SHA256SUMS.txt**. License and third-party notices are included in the ZIP.

          Maintainer: complete the [release checklist](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_TAG/docs/RELEASE.md) before publishing this draft.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'gtav-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes)
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--draft', '--title', "GTA V Save Editor $env:RELEASE_TAG", '--notes-file', $notesPath)
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
          $arguments += @('artifacts/release/GtaVSaveEditor-win-x64.zip', 'artifacts/release/SHA256SUMS.txt')
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; check for an existing release with this tag.' }
